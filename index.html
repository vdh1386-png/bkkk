<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyCn-QppCSS7HVs53G1-DyTnpUX_hloUADk",
authDomain:"mvhowbv.firebaseapp.com",
databaseURL:"https://mvhowbv-default-rtdb.firebaseio.com",
projectId:"mvhowbv",
storageBucket:"mvhowbv.firebasestorage.app",
messagingSenderId:"965620777330",
appId:"1:965620777330:web:9e0d5b9061b9d745da1deb"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const message=document.getElementById("message");
const resultArea=document.getElementById("resultArea");
const searchInput=document.getElementById("searchInput");
const searchButton=document.getElementById("searchButton");

function normalizeName(name){
return String(name||"")
.trim()
.replace(/\s+/g,"");
}

async function searchResult(){

const name=searchInput.value.trim();

resultArea.innerHTML="";

if(!name){
message.textContent="يرجى كتابة اسم الطالب";
return;
}

message.textContent="جاري البحث عن النتيجة...";
searchButton.disabled=true;

try{

const snapshot=await get(ref(db,"publicResults"));

if(!snapshot.exists()){
message.textContent="لا توجد بيانات طلاب في قاعدة البيانات";
return;
}

const students=snapshot.val();

const matches=Object.entries(students).filter(([id,student])=>{
return normalizeName(student.name)===normalizeName(name);
});

if(matches.length===0){
message.textContent="لم يتم العثور على الطالب، تأكد من كتابة الاسم كاملاً";
return;
}

message.textContent="";

matches.forEach(([id,student])=>{
showStudent(student);
});

}catch(error){

console.error("Firebase Error:",error);

message.textContent=
"تعذر الاتصال بقاعدة البيانات: "+
(error.code||"")+
" "+
(error.message||"يرجى المحاولة مرة أخرى");

}finally{
searchButton.disabled=false;
}

}

function showStudent(student){

const card=document.createElement("div");
card.className="result-card";

if(student.hidden){

const blocked=document.createElement("div");
blocked.className="blocked-result";

const title=document.createElement("div");
title.textContent="تم حجب النتيجة";

const reason=document.createElement("div");
reason.textContent="سبب الحجب: "+
(student.blockReason||"لم يتم تحديد السبب");

blocked.append(title,reason);
card.appendChild(blocked);
resultArea.appendChild(card);
return;

}

const title=document.createElement("h3");
title.textContent="نتيجة الطالب";

const info=document.createElement("div");
info.className="student-info-box";

info.innerHTML=`
<div class="student-info-title">معلومات الطالب</div>

<div class="student-info-item">
<span>اسم الطالب</span>
<strong>${student.name||"-"}</strong>
</div>

<div class="student-info-row">
<div class="student-info-item">
<span>الصف</span>
<strong>${student.grade||"-"}</strong>
</div>

<div class="student-info-item">
<span>الشعبة</span>
<strong>${student.section||"-"}</strong>
</div>
</div>
`;

const wrap=document.createElement("div");
wrap.className="result-table-wrap";

const table=document.createElement("table");
table.className="result-table";

const thead=document.createElement("thead");
const headerRow=document.createElement("tr");

[
"المادة","ش1","ش2","معدل1","نصف سنه",
"ش1","ش2","معدل2","سعي سنوي","درجه نهائيه"
    
    ].forEach(text=>{
const th=document.createElement("th");
th.textContent=text;
headerRow.appendChild(th);
});

thead.appendChild(headerRow);
table.appendChild(thead);

const tbody=document.createElement("tbody");

(student.grades||[]).forEach(subject=>{

const row=document.createElement("tr");

const subjectCell=document.createElement("td");
subjectCell.textContent=subject.subject||"";
row.appendChild(subjectCell);

for(let i=0;i<9;i++){
const td=document.createElement("td");
td.textContent=subject.grades?.[i]||"-";
row.appendChild(td);
}

tbody.appendChild(row);

});

table.appendChild(tbody);
wrap.appendChild(table);

card.append(title,info,wrap);
resultArea.appendChild(card);

}

searchButton.addEventListener("click",searchResult);

searchInput.addEventListener("keydown",event=>{
if(event.key==="Enter")searchResult();
});

</script>

<script>
function colorLowGrades() {
    const area = document.getElementById("resultArea");
    if (!area) return;

    area.querySelectorAll("table td").forEach(td => {
        const value = td.textContent.trim().replace(/[،,]/g, "");
        const number = Number(value);

        if (value !== "" && Number.isFinite(number) &&
            number >= 0 && number < 50) {
            td.classList.add("low-grade");
        } else {
            td.classList.remove("low-grade");
        }
    });
}

document.addEventListener("DOMContentLoaded", () => {
    colorLowGrades();

    const area = document.getElementById("resultArea");
    if (area) {
        new MutationObserver(colorLowGrades).observe(area, {
            childList: true,
            subtree: true,
            characterData: true
        });
    }
});
</script>

<script>
(function(){
    function formatStudentInfo(){
        document.querySelectorAll(".result-info").forEach(info=>{
            if(info.dataset.formatted==="yes") return;

            const text=info.textContent;

            const name=text.match(/اسم الطالب:\s*(.*?)\s*\|\s*الصف:/);
            const grade=text.match(/الصف:\s*(.*?)\s*\|\s*الشعبة:/);
            const section=text.match(/الشعبة:\s*(.*)/);

            if(!name || !grade || !section) return;

            const box=document.createElement("div");
            box.className="student-info-box";

            const nameRow=document.createElement("div");
            nameRow.innerHTML="الاســم: <span></span>";
            nameRow.querySelector("span").textContent=name[1];

            const gradeRow=document.createElement("div");
            gradeRow.innerHTML="الصـف: <span></span>";
            gradeRow.querySelector("span").textContent=grade[1];

            const sectionRow=document.createElement("div");
            sectionRow.innerHTML="الشعبة: <span></span>";
            sectionRow.querySelector("span").textContent=section[1];

            box.append(nameRow,gradeRow,sectionRow);
            info.replaceWith(box);
        });
    }

    formatStudentInfo();

    const observer=new MutationObserver(formatStudentInfo);
    observer.observe(document.getElementById("resultArea"),{
        childList:true,
        subtree:true
    });
})();
</script>

        "الشهر الثاني",
        "معدل الفصل الثاني",
        "سعي سنوي",
        "درجة نهائية"
    ];

    function convertTables(){

        document.querySelectorAll(
            "#resultArea .result-table-wrap"
        ).forEach(wrap => {

            if(wrap.dataset.converted === "yes") return;

            const table = wrap.querySelector(".result-table");
            if(!table) return;

            const rows = table.querySelectorAll("tbody tr");
            if(!rows.length) return;

            const container = document.createElement("div");
            container.className = "subjects-grid";

            rows.forEach(row => {

                const cells = row.querySelectorAll("td");
                if(!cells.length) return;

                const subjectCard = document.createElement("div");
                subjectCard.className = "subject-card";

                const subjectTitle = document.createElement("div");
                subjectTitle.className = "subject-card-title";
                subjectTitle.textContent = cells[0].textContent.trim();

                const grid = document.createElement("div");
                grid.className = "subject-grades-grid";

                for(let i = 0; i < 9; i++){

                    const item = document.createElement("div");
                    item.className = "grade-item";

                    const label = document.createElement("span");
                    label.className = "grade-label";
                    label.textContent = labels[i];

                    const value = document.createElement("strong");
                    value.className = "grade-value";

                    const grade = cells[i + 1]
                        ? cells[i + 1].textContent.trim()
                        : "-";

                    value.textContent = grade || "-";

                    const number = Number(
                        grade.replace(/[،,]/g,"")
                    );

                    if(
                        grade !== "" &&
                        grade !== "-" &&
                        Number.isFinite(number) &&
                        number >= 0 &&
                        number < 50
                    ){
                        item.classList.add("low-grade");
                    }

                    item.append(label,value);
                    grid.appendChild(item);
                }

                subjectCard.append(subjectTitle,grid);
                container.appendChild(subjectCard);
            });

            if(container.children.length){
                wrap.replaceWith(container);
                container.dataset.converted = "yes";
            }
        });
    }

    const area = document.getElementById("resultArea");

    if(area){

        const observer = new MutationObserver(convertTables);

        observer.observe(area,{
            childList:true,
            subtree:true
        });

        convertTables();
    }

})();

<script>
(function () {

    const labels = [
        "الشهر الأول",
        "الشهر الثاني",
        "معدل الفصل الأول",
        "نصف السنة",
        "الشهر الأول",
        "الشهر الثاني",
        "معدل الفصل الثاني",
        "السعي السنوي",
        "الدرجة النهائية"
    ];

    function convertResults() {

        const area = document.getElementById("resultArea");
        if (!area) return;

        area.querySelectorAll(".subjects-grid").forEach(oldGrid => {

            if (oldGrid.dataset.compactReady === "yes") return;

            const cards = Array.from(
                oldGrid.querySelectorAll(".subject-card")
            );

            if (!cards.length) return;

            const list = document.createElement("div");
            list.className = "compact-results";

            cards.forEach(card => {

                const title = card.querySelector(".subject-card-title");
                const grades = card.querySelectorAll(".grade-item");

                if (!title || !grades.length) return;

                const item = document.createElement("div");
                item.className = "subject-item";

                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "subject-toggle";

                const name = document.createElement("span");
                name.className = "subject-name";
                name.textContent = title.textContent.trim();

                const hint = document.createElement("span");
                hint.className = "subject-hint";
                hint.textContent = "انقر على السهم لعرض كافة الدرجات";

                const arrow = document.createElement("span");
                arrow.className = "subject-arrow";
                arrow.textContent = "⌄";

                toggle.append(name, hint, arrow);

                const details = document.createElement("div");
                details.className = "subject-details";

                const grid = document.createElement("div");
                grid.className = "grades-grid";

                grades.forEach((grade, i) => {

                    const cell = document.createElement("div");
                    cell.className = "grade-cell";

                    const label = document.createElement("span");
                    label.className = "grade-label";
                    label.textContent = labels[i] || "";

                    const value = document.createElement("span");
                    value.className = "grade-value";

                    value.textContent =
                        grade.querySelector(".grade-value")?.textContent.trim() || "-";

                    cell.append(label, value);
                    grid.appendChild(cell);
                });

                details.appendChild(grid);

                toggle.addEventListener("click", function () {
                    item.classList.toggle("open");
                });

                item.append(toggle, details);
                list.appendChild(item);
            });

            if (list.querySelector(".subject-item")) {
                oldGrid.replaceWith(list);
                list.dataset.compactReady = "yes";
            }
        });
    }

    const area = document.getElementById("resultArea");

    if (area) {
        const observer = new MutationObserver(convertResults);

        observer.observe(area, {
            childList: true,
            subtree: true
        });

        convertResults();
    }

})();
</script>

<script>
(function () {

            const الاسم = label.textContent.trim();

            if (الاسم === "معدل الفصل الأول") {
                label.textContent = "الفصل الأول";
            } else if (الاسم === "معدل الفصل الثاني") {
                label.textContent = "الفصل الثاني";
            }
        });
    }

    const المراقب = new MutationObserver(تعديل_التسميات);

    function تشغيل() {
        const المنطقة = document.getElementById("resultArea");
        if (المنطقة) {
            تعديل_التسميات();
            المراقب.observe(المنطقة, {
                childList: true,
                subtree: true,
                characterData: true
            });
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", تشغيل);
    } else {
        تشغيل();
    }
})();
</script>
